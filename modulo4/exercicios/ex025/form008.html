<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <p>
        <label for="in1">Número 1: </label>
        <input type="number" name="n1" id="in1" min="0" max="50" required>
    </p>

    <p>
        <label for="in2">Número 2: </label>
        <input type="number" name="n2" id="in2" min="0" max="50" required>
    </p>

    <p>
        <label for="isoma">Soma:</label>
        <output id="isoma">0</output>
    </p>

    <p>
        <input type="submit" value="Enviar" onclick="soma(in1, in2)">
        <input type="reset" value="Limpar">
    </p>

    <script>
        const result = document.getElementById('isoma');

        function soma(n1, n2) {
            result.innerText = Number(n1.value) + Number(n2.value);
        }
    </script>
</body>
</html>
