<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        .destaque {
            background-color: blue;
        }

        .cnome {
            background-color: chartreuse;
        }

        .cgrupo {
            background-color: rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="3">
        </colgroup>

        <caption>Cadastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Carlos Eduardo</td>
            <td>M</td>
            <td>32</td>
            <td>Engenheiro</td>
        </tr>

        <tr>
            <td>Fernanda Lima</td>
            <td>F</td>
            <td>28</td>
            <td>Designer</td>
        </tr>

        <tr>
            <td>João Pedro</td>
            <td>M</td>
            <td>40</td>
            <td>Professor</td>
        </tr>

        <tr>
            <td>Mariana Alves</td>
            <td>F</td>
            <td>22</td>
            <td>Programadora</td>
        </tr>

        <tr>
            <td>Ricardo Souza</td>
            <td>M</td>
            <td>35</td>
            <td>Médico</td>
        </tr>
    </table>
</body>
</html>
